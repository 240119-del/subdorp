<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Монитор статусов</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
        button { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .user-info { background: #e8f0fe; padding: 15px; border-radius: 8px; margin: 15px 0; display: flex; justify-content: space-between; }
        .status-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ccc; }
        select { padding: 5px 10px; border-radius: 20px; }
        .online { color: green; }
        .offline { color: gray; }
        .busy { color: orange; }
        .hidden { display: none; }
        .error { color: red; background: #ffe0e0; padding: 10px; border-radius: 8px; }
        .debug { background: #f4f4f4; padding: 10px; font-size: 11px; margin-top: 20px; border-radius: 5px; word-break: break-all; }
    </style>
</head>
<body>

<h1>📊 Монитор статусов</h1>

<div id="unauthed">
    <button id="googleBtn">🔐 Войти через Google</button>
    <p id="loginError" class="error" style="display:none;"></p>
</div>

<div id="authed" class="hidden">
    <div class="user-info">
        <span id="userEmail"></span>
        <button id="logoutBtn">Выйти</button>
    </div>
    <div id="myIdBlock" style="background:#f0f0f0; padding:8px; border-radius:5px; margin:10px 0; font-size:12px;">
        <strong>Ваш ID:</strong> <span id="myUserId"></span>
    </div>
    <div id="usersList">Загрузка...</div>
</div>

<div class="debug" id="debugLog">
    🔍 Отладка:<br>
    Инициализация...
</div>

<script>
    function log(msg) {
        const debugDiv = document.getElementById('debugLog');
        debugDiv.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' — ' + msg;
        console.log(msg);
    }

    log('Скрипт запущен');

    // ТВОИ ДАННЫЕ
    const SUPABASE_URL = 'https://idwsydwhvoftnthxvzfv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wMhIgD2JBPc2V79mW1kiTw_W7jm5poz';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    log('Supabase создан');

    // Элементы
    const unauthedDiv = document.getElementById('unauthed');
    const authedDiv = document.getElementById('authed');
    const googleBtn = document.getElementById('googleBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmailSpan = document.getElementById('userEmail');
    const myUserIdSpan = document.getElementById('myUserId');
    const usersListDiv = document.getElementById('usersList');
    const loginErrorDiv = document.getElementById('loginError');

    // Вход через Google
    async function signInWithGoogle() {
        log('Нажата кнопка Google, начинаем вход...');
        loginErrorDiv.style.display = 'none';
        
        try {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href,  // возврат на эту же страницу
                }
            });
            
            if (error) {
                log('Ошибка supabase.auth.signInWithOAuth: ' + error.message);
                loginErrorDiv.textContent = 'Ошибка: ' + error.message;
                loginErrorDiv.style.display = 'block';
                throw error;
            }
            
            log('signInWithOAuth вызван, редирект на Google...');
            // Supabase сам сделает редирект
        } catch (err) {
            log('Исключение: ' + err.message);
            loginErrorDiv.textContent = 'Ошибка: ' + err.message;
            loginErrorDiv.style.display = 'block';
        }
    }

    // Выход
    async function signOut() {
        log('Выход...');
        await supabase.auth.signOut();
        log('Выход выполнен');
    }

    // Загрузка списка пользователей
    async function loadUsers(currentUserId) {
        log('Загрузка пользователей, currentUserId=' + currentUserId);
        
        const { data, error } = await supabase.from('profiles').select('*');
        
        if (error) {
            log('Ошибка загрузки profiles: ' + error.message);
            usersListDiv.innerHTML = '<div class="error">Ошибка: ' + error.message + '</div>';
            return;
        }
        
        log('Загружено пользователей: ' + (data ? data.length : 0));
        
        if (!data || data.length === 0) {
            usersListDiv.innerHTML = '<p>👀 Нет пользователей. Добавьте запись в таблицу profiles.</p>';
            return;
        }
        
        let html = '';
        for (let user of data) {
            const isMe = (currentUserId && user.id === currentUserId);
            const statusClass = user.status || 'offline';
            
            if (isMe) {
                html += `
                    <div class="status-item" style="background:#e0ffe0;">
                        <span class="username">👤 ${escapeHtml(user.username)} (Вы)</span>
                        <select id="myStatusSelect">
                            <option value="online" ${statusClass === 'online' ? 'selected' : ''}>🟢 Онлайн</option>
                            <option value="busy" ${statusClass === 'busy' ? 'selected' : ''}>🟠 Занят</option>
                            <option value="offline" ${statusClass === 'offline' ? 'selected' : ''}>⚫ Офлайн</option>
                        </select>
                    </div>
                `;
            } else {
                let statusText = '';
                if (user.status === 'online') statusText = '🟢 Онлайн';
                else if (user.status === 'busy') statusText = '🟠 Занят';
                else statusText = '⚫ Офлайн';
                
                html += `
                    <div class="status-item">
                        <span class="username">👤 ${escapeHtml(user.username)}</span>
                        <span class="${statusClass}">${statusText}</span>
                    </div>
                `;
            }
        }
        
        usersListDiv.innerHTML = html;
        
        // Обработчик смены статуса
        const selectEl = document.getElementById('myStatusSelect');
        if (selectEl) {
            selectEl.addEventListener('change', async (e) => {
                const newStatus = e.target.value;
                log('Меняем статус на ' + newStatus);
                const { error } = await supabase
                    .from('profiles')
                    .update({ status: newStatus })
                    .eq('id', currentUserId);
                if (error) {
                    log('Ошибка обновления: ' + error.message);
                    alert('Ошибка: ' + error.message);
                } else {
                    log('Статус обновлён');
                    loadUsers(currentUserId); // обновляем список
                }
            });
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Проверка/добавление пользователя в таблицу profiles
    async function ensureUserInProfiles(user) {
        log('Проверяем пользователя в profiles: ' + user.id);
        
        const { data, error } = await supabase
            .from('profiles')
            .select('id')
            .eq('id', user.id)
            .maybeSingle();
            
        if (error && error.code !== 'PGRST116') {
            log('Ошибка проверки: ' + error.message);
            return;
        }
        
        if (!data) {
            log('Пользователь не найден, добавляем...');
            const username = user.email ? user.email.split('@')[0] : 'User_' + user.id.slice(0, 8);
            const { error: insertError } = await supabase
                .from('profiles')
                .insert({ id: user.id, username: username, status: 'online' });
            if (insertError) {
                log('Ошибка вставки: ' + insertError.message);
            } else {
                log('Пользователь добавлен: ' + username);
            }
        } else {
            log('Пользователь уже есть в таблице');
        }
    }

    // Обновление UI в зависимости от сессии
    async function checkSession() {
        log('Проверка сессии...');
        const { data: { session }, error } = await supabase.auth.getSession();
        
        if (error) {
            log('Ошибка getSession: ' + error.message);
            return;
        }
        
        if (session && session.user) {
            log('Сессия есть: ' + session.user.email);
            unauthedDiv.classList.add('hidden');
            authedDiv.classList.remove('hidden');
            userEmailSpan.textContent = session.user.email || 'No email';
            myUserIdSpan.textContent = session.user.id;
            
            await ensureUserInProfiles(session.user);
            await loadUsers(session.user.id);
        } else {
            log('Нет сессии');
            unauthedDiv.classList.remove('hidden');
            authedDiv.classList.add('hidden');
        }
    }
    
    // Подписка на изменения авторизации
    supabase.auth.onAuthStateChange(async (event, session) => {
        log('Auth state change: ' + event);
        if (event === 'SIGNED_IN' && session) {
            log('Пользователь вошёл: ' + session.user.email);
            await ensureUserInProfiles(session.user);
            unauthedDiv.classList.add('hidden');
            authedDiv.classList.remove('hidden');
            userEmailSpan.textContent = session.user.email;
            myUserIdSpan.textContent = session.user.id;
            await loadUsers(session.user.id);
        } else if (event === 'SIGNED_OUT') {
            log('Пользователь вышел');
            unauthedDiv.classList.remove('hidden');
            authedDiv.classList.add('hidden');
        }
    });
    
    // Подписка на изменения в таблице profiles в реальном времени
    supabase
        .channel('profiles-channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async () => {
            log('Изменение в profiles, перезагружаем...');
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                await loadUsers(session.user.id);
            }
        })
        .subscribe();
    
    // Обработчики кнопок
    googleBtn.onclick = signInWithGoogle;
    logoutBtn.onclick = signOut;
    
    // Запуск
    checkSession();
    
    log('Готово. Ждём действий...');
</script>

</body>
</html>
