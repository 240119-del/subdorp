<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub — Учебный портал</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: white;
            --text: #1a1a2e;
            --border: #e0e0e0;
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --online: #2ecc71;
            --offline: #95a5a6;
        }

        body.dark {
            --bg: #1a1a2e;
            --card: #16213e;
            --text: #ecf0f1;
            --border: #2c3e50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s; }
        .card-full { grid-column: span 3; }
        .header { background: var(--card); border-radius: 20px; padding: 15px 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary), #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .btn { padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-google { background: white; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; justify-content: center; width: 100%; }
        .btn-logout { background: var(--danger); color: white; }
        .status-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .status-btn { padding: 12px; border: none; border-radius: 14px; font-weight: 600; color: white; cursor: pointer; transition: transform 0.1s; }
        .status-btn:active { transform: scale(0.96); }
        .study-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .break-btn { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .finish-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .exit-btn { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
        .timer { text-align: center; padding: 20px; background: linear-gradient(135deg, rgba(67,97,238,0.1), rgba(168,85,247,0.1)); border-radius: 16px; margin: 15px 0; }
        .timer-display { font-size: 52px; font-weight: bold; font-family: monospace; color: var(--primary); }
        .badge-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; min-height: 80px; }
        .badge { padding: 6px 14px; border-radius: 30px; font-size: 12px; background: var(--bg); cursor: pointer; transition: all 0.2s; }
        .badge.unlocked { background: linear-gradient(135deg, #f9d423, #ff4e50); color: white; }
        .badge.locked { opacity: 0.5; }
        .rank-list { max-height: 400px; overflow-y: auto; }
        .rank-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
        .rank-number { width: 35px; font-weight: bold; font-size: 18px; }
        .rank-number.gold { color: #ffd700; }
        .rank-number.silver { color: #c0c0c0; }
        .rank-number.bronze { color: #cd7f32; }
        .member-list { max-height: 400px; overflow-y: auto; }
        .member { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .member-left { display: flex; align-items: center; gap: 10px; }
        .online-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online-dot.online { background: var(--online); box-shadow: 0 0 5px var(--online); }
        .online-dot.offline { background: var(--offline); }
        .chat-messages { height: 280px; overflow-y: auto; padding: 15px; background: var(--bg); border-radius: 16px; margin-bottom: 15px; }
        .message { margin-bottom: 12px; max-width: 75%; }
        .message-mine { margin-left: auto; }
        .message-bubble { padding: 8px 14px; border-radius: 18px; background: var(--card); display: inline-block; }
        .message-mine .message-bubble { background: var(--primary); color: white; }
        .message-name { font-size: 11px; font-weight: bold; margin-bottom: 4px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 25px; background: var(--card); color: var(--text); outline: none; }
        .chat-send { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 25px; cursor: pointer; }
        .action-bar { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .stats-btn { background: var(--primary); color: white; }
        .theme-btn { background: #8b5cf6; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); border-radius: 24px; padding: 25px; max-width: 450px; width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { max-width: 400px; text-align: center; }
        .hidden { display: none; }
        h3 { margin-bottom: 15px; padding-left: 10px; border-left: 4px solid var(--primary); }
        .stat-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<!-- Вход -->
<div id="loginPage" class="login-container">
    <div class="card login-card">
        <h2>📚 StudyHub</h2>
        <p style="margin: 15px 0;">Войди через Google, чтобы продолжить</p>
        <button id="googleLogin" class="btn btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Войти через Google
        </button>
    </div>
</div>

<!-- Основное приложение -->
<div id="app" class="container hidden">
    <div class="header">
        <div class="logo">📖 StudyHub</div>
        <div class="user-info">
            <span id="userName">Загрузка...</span>
            <div class="avatar" id="userAvatar">A</div>
            <button id="logoutBtn" class="btn btn-logout">Выйти</button>
        </div>
    </div>

    <div class="grid">
        <!-- Колонка 1 -->
        <div class="card">
            <h3>🎯 Моя сессия</h3>
            <div class="status-buttons">
                <button class="status-btn study-btn" data-status="study">📚 Учусь</button>
                <button class="status-btn break-btn" data-status="break">☕ Перерыв</button>
                <button class="status-btn finish-btn" data-status="finish">🏁 Завершить</button>
                <button class="status-btn exit-btn" data-status="exit">🚪 Выход</button>
            </div>
            <div class="timer">
                <div class="timer-display" id="timer">00:00:00</div>
                <div style="font-size: 12px;">время учёбы</div>
            </div>
            <div class="action-bar">
                <button class="action-btn stats-btn" id="statsBtn">📊 Моя статистика</button>
                <button class="action-btn theme-btn" id="themeBtn">🎨 Сменить тему</button>
            </div>
            <h3>🏆 Мои достижения</h3>
            <div class="badge-list" id="achievementsList">Загрузка...</div>
        </div>

        <!-- Колонка 2 -->
        <div class="card">
            <h3>📊 Топ студентов</h3>
            <div class="rank-list" id="ratingList">Загрузка...</div>
        </div>

        <!-- Колонка 3 -->
        <div class="card">
            <h3>👥 Монитор группы</h3>
            <div class="member-list" id="groupList">Загрузка...</div>
        </div>

        <!-- Колонка 4 (чат на всю ширину) -->
        <div class="card card-full">
            <h3>💬 Общий чат</h3>
            <div class="chat-messages" id="chatMessages">Загрузка...</div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="Напишите сообщение...">
                <button class="chat-send" id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модалка статистики -->
<div id="statsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 Моя статистика</h3>
            <button class="close-modal" id="closeModal">&times;</button>
        </div>
        <div id="statsContent">Загрузка...</div>
    </div>
</div>

<script>
    // ========== ТВОИ КЛЮЧИ ==========
    const SUPABASE_URL = 'https://idwsydwhvoftnthxvzfv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wMhIgD2JBPc2V79mW1kiTw_W7jm5poz';
    // ================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let studySeconds = 0;
    let timerInterval = null;
    let heartbeatInterval = null;

    // Достижения
    const ACHIEVEMENTS = [
        { key: 'early_bird', name: '🐦 Ранняя пташка', desc: 'Зашёл до 8:00' },
        { key: 'marathoner', name: '🏃 Марафонец', desc: 'Учился 2 часа подряд' },
        { key: 'activist', name: '🎙 Активист', desc: 'Написал 20 сообщений' },
        { key: 'hardworker', name: '💪 Трудяга', desc: 'Всего 10+ часов' },
        { key: 'speedy', name: '⚡ Скоростной', desc: '3+ часа за день' }
    ];

    // DOM элементы
    const loginPage = document.getElementById('loginPage');
    const app = document.getElementById('app');
    const googleLogin = document.getElementById('googleLogin');
    const logoutBtn = document.getElementById('logoutBtn');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const timerDisplay = document.getElementById('timer');
    const achievementsList = document.getElementById('achievementsList');
    const ratingList = document.getElementById('ratingList');
    const groupList = document.getElementById('groupList');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statsBtn = document.getElementById('statsBtn');
    const themeBtn = document.getElementById('themeBtn');
    const statsModal = document.getElementById('statsModal');
    const closeModal = document.getElementById('closeModal');
    const statsContent = document.getElementById('statsContent');

    // Форматирование времени
    function formatTime(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // Обновление таймера
    function updateTimer() {
        timerDisplay.textContent = formatTime(studySeconds);
    }

    // Таймер
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(async () => {
            studySeconds++;
            updateTimer();
            if (studySeconds % 30 === 0) await saveStudyTime();
            if (studySeconds >= 7200) await unlockAchievement('marathoner');
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    async function saveStudyTime() {
        if (!currentUser) return;
        await supabase.from('profiles').update({ study_seconds: studySeconds }).eq('id', currentUser.id);
        if (studySeconds >= 36000) await unlockAchievement('hardworker');
        await loadRating();
    }

    // Статус
    async function updateStatus(statusType) {
        if (!currentUser) return;

        if (statusType === 'study' && !timerInterval) {
            startTimer();
        } else if (statusType !== 'study' && timerInterval) {
            stopTimer();
            await saveStudyTime();
        }

        if (statusType === 'finish') {
            studySeconds = 0;
            updateTimer();
            await saveStudyTime();
        }

        const statusLabels = {
            study: '📚 Учусь',
            break: '☕ Перерыв',
            finish: '🏁 Завершил',
            exit: '🚪 Вышел'
        };

        await supabase.from('profiles').update({
            status_type: statusType,
            status: statusLabels[statusType],
            last_active: new Date().toISOString()
        }).eq('id', currentUser.id);

        await loadGroup();
        await loadRating();
    }

    // Достижения
    async function unlockAchievement(key) {
        if (!currentUser) return;
        const { data: existing } = await supabase
            .from('user_achievements')
            .select('*')
            .eq('user_id', currentUser.id)
            .eq('achievement', key)
            .maybeSingle();
        
        if (existing) return;
        
        await supabase.from('user_achievements').insert({
            user_id: currentUser.id,
            achievement: key
        });
        await loadAchievements();
    }

    async function loadAchievements() {
        if (!currentUser) {
            achievementsList.innerHTML = '<div>Войдите в аккаунт</div>';
            return;
        }
        const { data } = await supabase.from('user_achievements').select('achievement').eq('user_id', currentUser.id);
        const unlocked = new Set(data?.map(a => a.achievement) || []);
        
        achievementsList.innerHTML = ACHIEVEMENTS.map(ach => `
            <div class="badge ${unlocked.has(ach.key) ? 'unlocked' : 'locked'}" title="${ach.desc}">
                ${ach.name}
            </div>
        `).join('');
    }

    // Рейтинг
    async function loadRating() {
        const { data } = await supabase
            .from('profiles')
            .select('id, username, study_seconds')
            .order('study_seconds', { ascending: false })
            .limit(10);
        
        if (!data || data.length === 0) {
            ratingList.innerHTML = '<div>Нет данных</div>';
            return;
        }
        
        ratingList.innerHTML = data.map((user, index) => {
            let rankClass = '';
            if (index === 0) rankClass = 'gold';
            else if (index === 1) rankClass = 'silver';
            else if (index === 2) rankClass = 'bronze';
            
            const hours = Math.floor(user.study_seconds / 3600);
            const mins = Math.floor((user.study_seconds % 3600) / 60);
            
            return `
                <div class="rank-item">
                    <div class="rank-number ${rankClass}">${index + 1}</div>
                    <div><strong>${escapeHtml(user.username)}</strong> ${user.id === currentUser?.id ? '✓' : ''}</div>
                    <div style="margin-left: auto;">${hours}ч ${mins}м</div>
                </div>
            `;
        }).join('');
    }

    // Монитор группы
    async function loadGroup() {
        const { data } = await supabase.from('profiles').select('*').order('username');
        if (!data) return;
        
        const oneMinuteAgo = new Date(Date.now() - 60000).toISOString();
        
        groupList.innerHTML = data.map(user => {
            const isOnline = user.status_type !== 'exit' && user.last_active && user.last_active > oneMinuteAgo;
            
            let statusIcon = '';
            switch(user.status_type) {
                case 'study': statusIcon = '📚'; break;
                case 'break': statusIcon = '☕'; break;
                case 'finish': statusIcon = '🏁'; break;
                default: statusIcon = '💤';
            }
            
            const hours = Math.floor(user.study_seconds / 3600);
            
            return `
                <div class="member">
                    <div class="member-left">
                        <div class="online-dot ${isOnline ? 'online' : 'offline'}"></div>
                        <div><strong>${escapeHtml(user.username)}</strong><br><span style="font-size: 11px;">${statusIcon} ${user.status || '—'}</span></div>
                    </div>
                    <div>${hours}ч</div>
                </div>
            `;
        }).join('');
    }

    // Чат
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || !currentUser) return;
        
        await supabase.from('messages').insert({
            user_id: currentUser.id,
            username: currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0],
            message: message
        });
        
        messageInput.value = '';
        
        const { count } = await supabase
            .from('messages')
            .select('*', { count: 'exact', head: true })
            .eq('user_id', currentUser.id);
        
        if (count >= 20) await unlockAchievement('activist');
    }

    async function loadMessages() {
        const { data } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true })
            .limit(50);
        
        if (!data || data.length === 0) {
            chatMessages.innerHTML = '<div style="text-align: center;">💬 Нет сообщений</div>';
            return;
        }
        
        chatMessages.innerHTML = data.map(msg => `
            <div class="message ${msg.user_id === currentUser?.id ? 'message-mine' : ''}">
                <div class="message-bubble">
                    <div class="message-name">${escapeHtml(msg.username)}</div>
                    <div>${escapeHtml(msg.message)}</div>
                </div>
            </div>
        `).join('');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Статистика
    async function showStats() {
        if (!currentUser) return;
        
        const { count: msgCount } = await supabase
            .from('messages')
            .select('*', { count: 'exact', head: true })
            .eq('user_id', currentUser.id);
        
        const { data: achievements } = await supabase
            .from('user_achievements')
            .select('achievement')
            .eq('user_id', currentUser.id);
        
        const { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();
        
        const hours = Math.floor((profile?.study_seconds || 0) / 3600);
        const mins = Math.floor(((profile?.study_seconds || 0) % 3600) / 60);
        
        statsContent.innerHTML = `
            <div class="stat-item"><span>👤 Имя:</span><span>${escapeHtml(profile?.username)}</span></div>
            <div class="stat-item"><span>📧 Email:</span><span>${escapeHtml(profile?.email)}</span></div>
            <div class="stat-item"><span>⏱ Время учёбы:</span><span>${hours}ч ${mins}м</span></div>
            <div class="stat-item"><span>💬 Сообщений:</span><span>${msgCount || 0}</span></div>
            <div class="stat-item"><span>🏆 Достижений:</span><span>${achievements?.length || 0}/${ACHIEVEMENTS.length}</span></div>
            <div class="stat-item"><span>🟢 Статус:</span><span>${profile?.status || '—'}</span></div>
        `;
        statsModal.classList.add('active');
    }

    // Heartbeat (онлайн статус)
    async function updateHeartbeat() {
        if (!currentUser) return;
        await supabase.from('profiles').update({ last_active: new Date().toISOString() }).eq('id', currentUser.id);
        await loadGroup();
    }

    // Тема
    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    function loadTheme() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
        }
    }

    // Realtime подписки
    function setupRealtime() {
        const channel = supabase.channel('realtime-channel');
        
        channel.on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            loadGroup();
            loadRating();
        });
        
        channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
            loadMessages();
        });
        
        channel.on('postgres_changes', { event: '*', schema: 'public', table: 'user_achievements' }, () => {
            loadAchievements();
        });
        
        channel.subscribe();
    }

    // Синхронизация профиля
    async function syncProfile(user) {
        const { data: existing } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .maybeSingle();
        
        if (!existing) {
            await supabase.from('profiles').insert({
                id: user.id,
                username: user.user_metadata?.full_name || user.email?.split('@')[0],
                email: user.email,
                status_type: 'exit',
                status: '🚪 Вышел',
                study_seconds: 0,
                last_active: new Date().toISOString()
            });
            studySeconds = 0;
            updateTimer();
        } else {
            studySeconds = existing.study_seconds || 0;
            updateTimer();
            if (existing.status_type === 'study') {
                startTimer();
            }
        }
        
        const hour = new Date().getHours();
        if (hour < 8) await unlockAchievement('early_bird');
        
        await loadAchievements();
    }

    // Вход/выход
    async function login() {
        await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
    }

    async function logout() {
        if (timerInterval) clearInterval(timerInterval);
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        await supabase.auth.signOut();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    // Обработка авторизации
    async function onAuthStateChange(user) {
        if (user) {
            currentUser = user;
            await syncProfile(user);
            
            userName.textContent = user.user_metadata?.full_name || user.email;
            userAvatar.textContent = (user.user_metadata?.full_name || user.email || 'U')[0].toUpperCase();
            
            await loadGroup();
            await loadMessages();
            await loadRating();
            await loadAchievements();
            
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(updateHeartbeat, 30000);
            setupRealtime();
            
            loginPage.classList.add('hidden');
            app.classList.remove('hidden');
        } else {
            currentUser = null;
            loginPage.classList.remove('hidden');
            app.classList.add('hidden');
        }
    }

    // Обработчики событий
    googleLogin.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    statsBtn.addEventListener('click', showStats);
    themeBtn.addEventListener('click', toggleTheme);
    closeModal.addEventListener('click', () => statsModal.classList.remove('active'));
    statsModal.addEventListener('click', (e) => { if (e.target === statsModal) statsModal.classList.remove('active'); });
    
    document.querySelectorAll('[data-status]').forEach(btn => {
        btn.addEventListener('click', () => updateStatus(btn.dataset.status));
    });

    // Слушаем изменения авторизации
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session?.user) {
            onAuthStateChange(session.user);
        } else if (event === 'SIGNED_OUT') {
            onAuthStateChange(null);
        }
    });

    // Запуск
    supabase.auth.getSession().then(({ data: { session } }) => {
        onAuthStateChange(session?.user || null);
    });
    
    loadTheme();
</script>
</body>
</html>
