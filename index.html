<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов на Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .username {
            font-weight: bold;
        }
        select {
            padding: 5px;
        }
        .online { color: green; }
        .offline { color: gray; }
        .busy { color: orange; }
        #my-id {
            background: #f0f0f0;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<h2>📊 Монитор статусов</h2>

<div id="my-id">
    <strong>Ваш ID:</strong> b54c95bd-e46f-470f-9924-57471e6b134a
</div>

<div id="status-list">
    Загрузка...
</div>

<script>
    // ========== ТВОИ КЛЮЧИ ИЗ SUPABASE ==========
    const SUPABASE_URL = 'https://idwsydwhvoftnthxvzfv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wMhIgD2JBPc2V79mW1kiTw_W7jm5poz';
    const MY_USER_ID = 'b54c95bd-e46f-470f-9924-57471e6b134a';
    // ===========================================

    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Загрузка списка пользователей
    async function loadUsers() {
        const { data: profiles, error } = await supabase
            .from('profiles')
            .select('*');

        if (error) {
            console.error('Ошибка:', error);
            document.getElementById('status-list').innerHTML = '<p style="color:red">Ошибка загрузки. Проверь RLS.</p>';
            return;
        }

        if (!profiles || profiles.length === 0) {
            document.getElementById('status-list').innerHTML = '<p>Нет пользователей. Добавь себя в таблицу.</p>';
            return;
        }

        let html = '';
        for (let user of profiles) {
            const isMe = (user.id === MY_USER_ID);
            
            // Определяем класс для стиля статуса
            let statusClass = '';
            let statusText = user.status || 'offline';
            if (statusText === 'online') statusClass = 'online';
            else if (statusText === 'busy') statusClass = 'busy';
            else statusClass = 'offline';

            if (isMe) {
                // Мой профиль - с выпадающим списком
                html += `
                    <div class="status-item" style="background:#e8f4ff;">
                        <div class="username">👤 ${user.username} (Вы)</div>
                        <div>
                            <select id="status-select">
                                <option value="online" ${user.status === 'online' ? 'selected' : ''}>🟢 Онлайн</option>
                                <option value="busy" ${user.status === 'busy' ? 'selected' : ''}>🟠 Занят</option>
                                <option value="offline" ${user.status === 'offline' ? 'selected' : ''}>⚫ Офлайн</option>
                            </select>
                        </div>
                    </div>
                `;
            } else {
                // Другие пользователи - только просмотр
                let statusSymbol = '';
                if (user.status === 'online') statusSymbol = '🟢';
                else if (user.status === 'busy') statusSymbol = '🟠';
                else statusSymbol = '⚫';
                
                html += `
                    <div class="status-item">
                        <div class="username">👤 ${user.username}</div>
                        <div class="${statusClass}">${statusSymbol} ${user.status || 'offline'}</div>
                    </div>
                `;
            }
        }
        
        document.getElementById('status-list').innerHTML = html;
        
        // Добавляем обработчик для select (только если он есть)
        const selectEl = document.getElementById('status-select');
        if (selectEl) {
            selectEl.addEventListener('change', async (e) => {
                const newStatus = e.target.value;
                await updateStatus(newStatus);
            });
        }
    }

    // Обновление статуса
    async function updateStatus(newStatus) {
        const { error } = await supabase
            .from('profiles')
            .update({ status: newStatus })
            .eq('id', MY_USER_ID);

        if (error) {
            console.error('Ошибка обновления:', error);
            alert('Не удалось обновить статус. Проверь RLS политику UPDATE.');
        } else {
            console.log('Статус обновлён:', newStatus);
            loadUsers(); // Перезагружаем список
        }
    }

    // Подписка на изменения в реальном времени (из методички)
    supabase
        .channel('profiles-channel')
        .on('postgres_changes', 
            { event: '*', schema: 'public', table: 'profiles' }, 
            (payload) => {
                console.log('Изменение в базе:', payload);
                loadUsers();
            }
        )
        .subscribe();

    // Запускаем загрузку
    loadUsers();
</script>

</body>
</html>
